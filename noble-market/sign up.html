<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Noble Market</title>
  <link rel="icon" type="image/jpg" href="Noble's logo.jpg">
  <!-- Using Tailwind CDN since you don't have assets/index.css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1d293d',
            'primary-light': '#24364f',
            secondary: '#3b82f6',
            third: '#f63b3b',
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="min-h-screen w-full flex overflow-x-hidden bg-gradient-to-br from-[#141b29] via-[#1d293d] to-[#0d1219]">

  <!-- Left: brand panel -->
  <div class="hidden lg:block lg:w-1/2 min-w-0 relative overflow-hidden">
    <img src="https://picsum.photos/seed/auth2/1200/1200"
         alt="Noble Market" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-[#0d1219]/90 via-[#0d1219]/20 to-[#0d1219]/40"></div>
    <div class="relative z-10 h-full flex flex-col justify-between p-10">
      <a href="index.html" class="flex items-center gap-3 text-white">
        <img src="Noble's logo.jpg" alt="Noble Market" class="w-10 h-10 rounded-full object-cover border border-white/20" onerror="this.style.display='none'">
        <span class="text-xl font-semibold tracking-tight">Noble Market</span>
      </a>
      <div class="text-white max-w-md">
        <h2 class="text-3xl font-bold leading-tight mb-3">Join the market</h2>
        <p class="text-white/80 text-base leading-relaxed">
          Create an account to unlock exclusive deals, save products to your wishlist, and get faster checkout.
        </p>
      </div>
      <div class="flex gap-2">
        <span class="h-1.5 w-8 bg-white rounded-full"></span>
        <span class="h-1.5 w-4 bg-white/30 rounded-full"></span>
        <span class="h-1.5 w-4 bg-white/30 rounded-full"></span>
      </div>
    </div>
  </div>

  <!-- Right: form -->
  <div class="w-full lg:w-1/2 min-w-0 flex items-center justify-center p-4 sm:p-8 relative overflow-hidden">
    <div class="pointer-events-none absolute -top-24 -right-24 w-72 h-72 bg-primary/20 rounded-full blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-24 -left-24 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl"></div>

    <div class="relative z-10 w-full max-w-xl">
      <div class="w-full rounded-3xl bg-white shadow-2xl p-8 sm:p-10">

        <div class="text-center mb-7">
          <h1 class="text-3xl font-bold text-slate-800 mb-2">Create Account</h1>
          <p class="text-slate-600">Join Noble Market in a few quick steps</p>
        </div>

        <form id="signupForm" class="space-y-4" onsubmit="return handleSignUp(event)">

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
              <input id="fname" type="text" required
                     class="w-full px-3.5 py-3 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary border border-slate-200"
                     placeholder="First name">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
              <input id="lname" type="text" required
                     class="w-full px-3.5 py-3 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary border border-slate-200"
                     placeholder="Last name">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-700"></i>
              <input id="email" type="email" required
                     class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary border border-slate-200"
                     placeholder="you@example.com" autocomplete="username">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
            <div class="relative">
              <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-700"></i>
              <input id="phone" type="tel"
                     class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary border border-slate-200"
                     placeholder="+250781234567">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
              <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-700"></i>
                <input id="password" type="password" required
                       class="w-full pl-12 pr-12 py-3.5 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary border border-slate-200"
                       placeholder="At least 6 characters" autocomplete="new-password">
                <button type="button" onclick="togglePwd('password','eye1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-800" aria-label="Toggle">
                  <i id="eye1" class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">Confirm Password</label>
              <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-700"></i>
                <input id="password2" type="password" required
                       class="w-full pl-12 pr-12 py-3.5 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary border border-slate-200"
                       placeholder="Re-enter your password" autocomplete="new-password">
                <button type="button" onclick="togglePwd('password2','eye2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-800" aria-label="Toggle">
                  <i id="eye2" class="fas fa-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <div id="errBox" class="hidden p-3 rounded-xl bg-red-100 text-red-800 text-sm"></div>

          <button type="submit"
                  class="w-full bg-primary hover:bg-primary-light text-white font-semibold py-3.5 rounded-xl transition-all mt-2">
            Create Account
          </button>
        </form>

        <p class="text-center text-slate-700 mt-7">
          Already have an account?
          <a href="sign in.html" class="text-primary font-medium hover:underline">Sign in</a>
        </p>

        <a href="index.html" class="block text-center text-slate-400 hover:text-slate-700 text-sm mt-3 transition-colors">
          Back to Home
        </a>
      </div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
function togglePwd(id, iconId) {
  const inp = document.getElementById(id);
  const icon = document.getElementById(iconId);
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
}

function showError(msg) {
  const box = document.getElementById('errBox');
  box.textContent = msg;
  box.classList.remove('hidden');
}

function handleSignUp(e) {
  e.preventDefault();
  const fname = document.getElementById('fname').value.trim();
  const lname = document.getElementById('lname').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const pass = document.getElementById('password').value;
  const pass2 = document.getElementById('password2').value;

  if (!fname || !lname) return showError('Please enter your full name.');
  if (!validateEmail(email)) return showError('Please enter a valid email address.');
  if (pass.length < 6) return showError('Password must be at least 6 characters.');
  if (pass !== pass2) return showError('Passwords do not match.');

  if (getUser()) return showError('An account already exists on this device. Please sign in.');

  // 1. Create the new user object with metadata for the admin
  const newUser = { 
    id: Date.now().toString(),
    fname, 
    lname, 
    email, 
    phone, 
    pass, 
    city: '', 
    address: '',
    joined: new Date().toISOString(),
    role: 'Customer'
  };

  // 2. Save as the current logged-in user
  localStorage.setItem('nm_user', JSON.stringify(newUser));
  
  // 3. Add to the global list for the Admin dashboard
  const allUsers = getAllUsers();
  allUsers.push(newUser);
  saveAllUsers(allUsers);

  // 4. Log in and redirect
  sessionStorage.setItem('nm_auth', 'true');
  window.location.href = 'index.html';
  return false;
}
</script>
</body>
</html>
