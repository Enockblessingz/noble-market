<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Noble Market</title>
  <link rel="icon" type="image/jpg" href="Noble's logo.jpg">
  <link rel="stylesheet" href="assets/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50">

<!-- Header -->
<header class="bg-primary text-white border-b border-white/10">
  <div class="max-w-full md:max-w-11/12 mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-3 flex-wrap">
    <a href="index.html" class="flex items-center gap-3">
      <img src="Noble's logo.jpg" alt="Noble Market" class="w-10 h-10 rounded-full object-cover border border-white/20" onerror="this.style.display='none'">
      <div>
        <div class="font-bold text-lg">Noble Market — Admin</div>
        <div class="text-xs text-white/70">Add products to the store</div>
      </div>
    </a>
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-sm px-3 py-2 rounded-lg hover:bg-white/10 transition-colors">
        <i class="fas fa-store mr-1"></i> Store
      </a>
      <button id="logoutBtn" class="text-sm px-3 py-2 rounded-lg bg-third hover:bg-third/90 transition-colors">
        <i class="fas fa-sign-out-alt mr-1"></i> Log out
      </button>
    </div>
  </div>
</header>

<main class="max-w-full md:max-w-11/12 mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <h1 class="text-2xl md:text-3xl font-bold text-primary mb-6">Add New Product</h1>

  <!-- Form -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-8 mb-8">
    <form id="productForm" onsubmit="return handleAddProduct(event)">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
          <input id="productName" type="text" required
                 placeholder="e.g. Samsung Galaxy A54"
                 class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Product Image</label>
          <input id="productImage" type="file" accept="image/*" onchange="previewImage(this)"
                 class="w-full text-sm text-gray-700 border border-gray-300 rounded-lg p-2 cursor-pointer">
          <div id="imagePreview" class="mt-3 flex flex-wrap gap-2"></div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Price (RWF)</label>
          <input id="price" type="number" min="0" required placeholder="Enter price in RWF"
                 class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Stock Quantity</label>
          <input id="stock" type="number" min="0" required placeholder="Enter stock quantity"
                 class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
          <select id="category" required
                  class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
            <option value="">Select category</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
          <textarea id="description" rows="3" required placeholder="Write a short description…"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm resize-none"></textarea>
        </div>

      </div>

      <button type="submit"
              class="mt-6 w-full md:w-auto px-6 py-3 bg-primary hover:bg-primary-light text-white font-semibold rounded-lg transition-colors">
        <i class="fas fa-plus mr-2"></i> Add Product
      </button>
    </form>
  </div>

  <!-- List -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-8">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-primary">Your Custom Products (<span id="count">0</span>)</h2>
      <button onclick="renderList()" class="text-sm px-3 py-1.5 border border-gray-300 rounded-lg hover:bg-gray-50">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
    <div id="list" class="space-y-3"></div>
  </div>

</main>

<script src="shared.js"></script>
<script>
/* Auth guard */
if (!isLoggedIn()) {
  sessionStorage.setItem('nm_redirect', 'admin.html');
  window.location.href = 'sign in.html';
}

/* Populate categories */
const catSel = document.getElementById('category');
CATEGORIES.forEach(c => {
  const o = document.createElement('option');
  o.value = c;
  o.textContent = c;
  catSel.appendChild(o);
});

/* Image preview */
let pendingImageDataUrl = '';
function previewImage(input) {
  const box = document.getElementById('imagePreview');
  box.innerHTML = '';
  const f = input.files && input.files[0];
  if (!f) { pendingImageDataUrl = ''; return; }
  const reader = new FileReader();
  reader.onloadend = () => {
    pendingImageDataUrl = reader.result;
    const img = document.createElement('img');
    img.src = reader.result;
    img.alt = 'Preview';
    img.className = 'w-20 h-20 object-cover rounded-lg border border-gray-200';
    box.appendChild(img);
  };
  reader.readAsDataURL(f);
}

/* Add product */
function handleAddProduct(e) {
  e.preventDefault();
  const name = document.getElementById('productName').value.trim();
  const price = parseInt(document.getElementById('price').value, 10);
  const stock = parseInt(document.getElementById('stock').value, 10);
  const category = document.getElementById('category').value;
  const desc = document.getElementById('description').value.trim();

  if (!name || !category || !desc || isNaN(price) || isNaN(stock)) {
    alert('Please fill in every field.');
    return false;
  }

  const id = 'NM-CUSTOM-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const product = {
    Product_Id: id,
    Product_Name: name,
    Product_Category: category,
    Product_Description: desc,
    Product_Price: price,
    Product_Stock: stock,
    Product_Image_url: pendingImageDataUrl || ('https://picsum.photos/seed/' + encodeURIComponent(name) + '/400/300'),
    Product_Tags: 'new,custom'
  };
  addCustomProduct(product);

  alert('✅ Product added: ' + name);
  document.getElementById('productForm').reset();
  document.getElementById('imagePreview').innerHTML = '';
  pendingImageDataUrl = '';
  renderList();
  return false;
}

/* List */
function renderList() {
  const arr = loadCustomProducts();
  const count = document.getElementById('count');
  if (count) count.textContent = arr.length;

  const list = document.getElementById('list');
  if (!list) return;

  if (arr.length === 0) {
    list.innerHTML = '<p class="text-gray-500 italic text-sm py-4 text-center">No custom products yet. Add one above.</p>';
    return;
  }

  list.innerHTML = arr.map(p => `
    <div class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg bg-gray-50">
      <img src="${escapeHtml(p.Product_Image_url)}" alt="${escapeHtml(p.Product_Name)}"
           class="w-14 h-14 object-cover rounded-lg bg-white border border-gray-200">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-gray-900 text-sm truncate">${escapeHtml(p.Product_Name)}</div>
        <div class="text-xs text-gray-500 truncate">${escapeHtml(p.Product_Category)} · ${fmt(p.Product_Price)} · Stock ${p.Product_Stock}</div>
      </div>
      <button onclick="deleteProduct('${p.Product_Id}')"
              class="px-3 py-1.5 rounded-lg bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 text-xs font-semibold">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  `).join('');
}

function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  removeCustomProduct(id);
  renderList();
}

/* Logout */
document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('nm_auth');
  window.location.href = 'index.html';
});

renderList();
</script>
</body>
</html>
