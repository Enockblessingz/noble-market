<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Noble Market</title>
  <link rel="icon" type="image/jpg" href="Noble's logo.jpg">
  <link rel="stylesheet" href="assets/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="min-h-screen w-full flex overflow-x-hidden bg-gradient-to-br from-[#141b29] via-[#1d293d] to-[#0d1219]">

  <!-- Left: brand / hero panel -->
  <div class="hidden lg:block lg:w-1/2 min-w-0 relative overflow-hidden">
    <img src="https://picsum.photos/seed/auth/1200/1200"
         alt="Noble Market" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-[#0d1219]/90 via-[#0d1219]/20 to-[#0d1219]/40"></div>
    <div class="relative z-10 h-full flex flex-col justify-between p-10">
      <a href="index.html" class="flex items-center gap-3 text-white">
        <img src="Noble's logo.jpg" alt="Noble Market" class="w-10 h-10 rounded-full object-cover border border-white/20" onerror="this.style.display='none'">
        <span class="text-xl font-semibold tracking-tight">Noble Market</span>
      </a>
      <div class="text-white max-w-md">
        <h2 class="text-3xl font-bold leading-tight mb-3">Welcome back</h2>
        <p class="text-white/80 text-base leading-relaxed">
          Sign in to track your orders, manage your wishlist, and get fast delivery on fresh products across Kigali.
        </p>
      </div>
      <div class="flex gap-2">
        <span class="h-1.5 w-8 bg-white rounded-full"></span>
        <span class="h-1.5 w-4 bg-white/30 rounded-full"></span>
        <span class="h-1.5 w-4 bg-white/30 rounded-full"></span>
      </div>
    </div>
  </div>

  <!-- Right: form -->
  <div class="w-full lg:w-1/2 min-w-0 flex items-center justify-center p-4 sm:p-8 relative overflow-hidden">
    <div class="pointer-events-none absolute -top-24 -right-24 w-72 h-72 bg-primary/20 rounded-full blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-24 -left-24 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl"></div>

    <div class="relative z-10 w-full max-w-xl">
      <div class="w-full rounded-3xl bg-white shadow-2xl p-8 sm:p-10">

        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-slate-800 mb-2">Welcome Back</h1>
          <p class="text-slate-600">Sign in to continue to Noble Market</p>
        </div>

        <form id="signinForm" class="space-y-5" onsubmit="return handleSignIn(event)">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Email or Phone Number</label>
            <div class="relative">
              <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-700"></i>
              <input id="identifier" type="text"
                     class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary transition-all border border-slate-200"
                     placeholder="you@example.com or +250781234567" autocomplete="username" required>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-700"></i>
              <input id="password" type="password"
                     class="w-full pl-12 pr-12 py-3.5 rounded-xl bg-slate-50 text-slate-700 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary transition-all border border-slate-200"
                     placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" onclick="togglePwd()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-800" aria-label="Toggle password">
                <i id="eyeIcon" class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div id="errBox" class="hidden p-3 rounded-xl bg-red-100 text-red-800 text-sm"></div>

          <button type="submit"
                  class="w-full bg-primary hover:bg-primary-light text-white font-semibold py-3.5 rounded-xl transition-all">
            Sign In
          </button>
        </form>

        <div class="relative my-7">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-3 bg-white text-slate-700">or</span>
          </div>
        </div>

        <p class="text-center text-slate-700">
          Don't have an account?
          <a href="sign up.html" class="text-primary font-medium hover:underline">Create one</a>
        </p>

        <a href="index.html" class="block text-center text-slate-400 hover:text-slate-700 text-sm mt-3 transition-colors">
          Back to shopping
        </a>
      </div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
function togglePwd() {
  const inp = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
}

function showError(msg) {
  const box = document.getElementById('errBox');
  box.textContent = msg;
  box.classList.remove('hidden');
}

function handleSignIn(e) {
  e.preventDefault();
  const identifier = document.getElementById('identifier').value.trim();
  const pass = document.getElementById('password').value;

  if (!identifier || !pass) return showError('Enter your credentials.');

  const user = getUser();
  if (!user) return showError('No account found on this device. Please create one first.');

  const match = (user.email === identifier) || (user.phone === identifier);
  if (!match || user.pass !== pass) return showError('Invalid email/phone or password.');

  sessionStorage.setItem('nm_auth', 'true');
  window.location.href = 'index.html';
  return false;
}
</script>
</body>
</html>
